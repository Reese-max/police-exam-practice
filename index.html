<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f5f1e8">
  <!-- 無 meta refresh：停用 JS 時 meta refresh 會丟掉 query/hash，自動跳轉改由下方 script 負責 -->
  <link rel="canonical" href="https://reese-max.github.io/police-exam-archive/quiz.html">
  <title>警察特考線上練習已整合</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f1e8;
      --panel: #fff;
      --text: #292724;
      --muted: #6f6961;
      --line: #ddd6cc;
      --primary: #376b4d;
      --primary-hover: #2d5a40;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1a18;
        --panel: #272521;
        --text: #ece7df;
        --muted: #b0a89e;
        --line: #47423b;
        --primary: #82b696;
        --primary-hover: #9bc9aa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(28px, 6vw, 48px);
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }
    h1 { margin: 0 0 12px; font-size: clamp(26px, 6vw, 38px); line-height: 1.25; }
    p { margin: 10px 0; color: var(--muted); }
    .primary {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      margin-top: 22px;
      padding: 11px 20px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    .primary:hover { background: var(--primary-hover); }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    nav a { color: var(--primary); font-weight: 650; }
    code {
      padding: 2px 5px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--line) 45%, transparent);
    }
  </style>
</head>
<body>
  <main>
    <h1>警察特考線上練習已整合</h1>
    <p>
      本專案已併入完整的警察特考考古題平台。題庫、搜尋、模擬考、
      統計及 115 年資料現在共用同一套來源，避免兩個網站內容不同步。
    </p>
    <p id="redirect-status" role="status" aria-live="polite">
      即將前往新版模擬考；未自動跳轉時，請使用下方按鈕。
    </p>

    <a class="primary" id="continue-link"
       href="https://reese-max.github.io/police-exam-archive/quiz.html">
      進入新版模擬考
    </a>

    <noscript>
      <p style="margin-top:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;">
        瀏覽器已停用 JavaScript：不會自動跳轉，請點上方按鈕。
        注意：網址中的查詢參數（篩選條件、頁碼）需要 JavaScript 才能帶到新版網站；
        若你在連結後方帶有參數，啟用 JavaScript 後重新進入即可保留。
      </p>
    </noscript>

    <nav aria-label="新版題庫其他功能">
      <a href="https://reese-max.github.io/police-exam-archive/">題庫首頁</a>
      <a href="https://reese-max.github.io/police-exam-archive/search.html">全文搜尋</a>
      <a href="https://reese-max.github.io/police-exam-archive/analytics.html">出題統計</a>
      <a href="https://github.com/Reese-max/police-exam-archive">GitHub 原始碼</a>
    </nav>
  </main>

  <script>
  (function () {
    "use strict";
    var target = new URL("https://reese-max.github.io/police-exam-archive/quiz.html");
    target.search = window.location.search;
    target.hash = window.location.hash;

    var link = document.getElementById("continue-link");
    link.href = target.href;

    window.setTimeout(function () {
      window.location.replace(target.href);
    }, 1200);
  })();
  </script>
</body>
</html>
