<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>警察特考練習系統已整合</title>
<style>
:root{color-scheme:light dark;--bg:#f3f5f7;--card:#fff;--line:#dbe2e8;--text:#17212b;--muted:#607080;--primary:#173f5f}
@media(prefers-color-scheme:dark){:root{--bg:#111820;--card:#1a2530;--line:#344452;--text:#edf3f7;--muted:#a8b5bf;--primary:#8dc5e7}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}.card{width:min(560px,calc(100% - 32px));padding:30px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(20,42,60,.1)}h1{margin:0 0 10px;font-size:28px}p{color:var(--muted)}.features{margin:22px 0;padding:0;list-style:none;display:grid;gap:8px}.features li{padding:9px 11px;border:1px solid var(--line);border-radius:9px}.button{display:block;text-align:center;background:#173f5f;color:#fff;text-decoration:none;font-weight:800;padding:13px 18px;border-radius:10px}.small{font-size:13px;text-align:center;margin-bottom:0}
</style>
<script>
(function(){
  var target=new URL('https://reese-max.github.io/police-exam-archive/practice.html');
  var current=new URLSearchParams(location.search);
  current.forEach(function(value,key){target.searchParams.append(key,value)});
  target.searchParams.set('from','legacy');
  target.hash=location.hash;
  location.replace(target.href);
})();
</script>
</head>
<body>
<main class="card">
  <h1>練習系統已整合</h1>
  <p>舊版單檔題庫已停止獨立維護，現在與完整考古題資料庫共用同一份資料。</p>
  <ul class="features">
    <li>涵蓋民國 106–115 年</li>
    <li>支援閱讀題組、複數正解與送分題</li>
    <li>提供搜尋、計時、續答、錯題回顧與練習紀錄</li>
  </ul>
  <a class="button" href="https://reese-max.github.io/police-exam-archive/practice.html?from=legacy">進入新版線上練習</a>
  <p class="small">正在自動轉址；原本的篩選參數與書籤位置會一併帶入。</p>
</main>
</body>
</html>
